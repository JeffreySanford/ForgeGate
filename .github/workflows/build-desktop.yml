name: Build Desktop Installers

# Manually triggered on purpose: this is a slower, heavier build than the
# regular lint/test CI (ci.yml) and produces real installers, not just a
# pass/fail signal, so it shouldn't run on every push.
#
# macOS is deliberately not in this matrix yet — see
# documentation/20-risks-and-decisions.md and TODO.md's "Quality
# foundation" notes for why. Windows and Linux only for now.
on:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-latest
            bundles: deb,appimage

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev

      - run: pnpm install --frozen-lockfile

      # Builds the Angular frontend (via beforeBuildCommand in
      # tauri.conf.json) and then the native Tauri bundle. Unsigned —
      # real code signing needs paid certificates (Apple Developer
      # Program, a Windows code-signing cert) and is a deliberate,
      # separate later decision, not part of proving this builds at all.
      - name: Build Tauri bundle
        working-directory: apps/forgegate-desktop/src-tauri
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forgegate-desktop-${{ matrix.platform }}
          path: |
            apps/forgegate-desktop/src-tauri/target/release/bundle/**/*.msi
            apps/forgegate-desktop/src-tauri/target/release/bundle/**/*.exe
            apps/forgegate-desktop/src-tauri/target/release/bundle/**/*.deb
            apps/forgegate-desktop/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
