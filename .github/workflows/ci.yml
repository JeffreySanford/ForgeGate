name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile
      - run: npx nx format:check --base="remotes/origin/master"
      - run: npx nx run-many -t lint test build typecheck cargo-test

  # Separate job on windows-latest, not folded into `main`: the committed
  # Playwright baselines (apps/forgegate-desktop/e2e/**/*-win32.png) were
  # captured on Windows, and cross-OS font rendering differences make a
  # Windows-captured screenshot compare unreliably against a Linux
  # renderer. Matching the runner OS to the baseline OS is simpler and
  # more honest than fighting rendering diffs across platforms.
  e2e-visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: npx playwright install chromium --with-deps
      - run: npx nx run forgegate-desktop:e2e
