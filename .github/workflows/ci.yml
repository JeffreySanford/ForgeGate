name: CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  diagnose-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile
      - name: Capture quality output
        shell: bash
        run: |
          set +e
          npx nx run-many -t lint test build typecheck cargo-test --output-style=stream > quality.log 2>&1
          status=$?
          echo "$status" > quality-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-quality-log
          path: |
            quality.log
            quality-status.txt
      - name: Preserve failure status
        shell: bash
        run: test "$(cat quality-status.txt)" -eq 0
