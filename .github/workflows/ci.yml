name: CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  format-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: >-
          npx prettier
          apps/forgegate-desktop/src/app/storybook/storybook-index.ts
          apps/forgegate-desktop/src/app/storybook/storybook-index.spec.ts
          --write
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-storybook-parser
          path: apps/forgegate-desktop/src/app/storybook/
