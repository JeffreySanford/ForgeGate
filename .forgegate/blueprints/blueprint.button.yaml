id: blueprint.button
version: 1.0.0
name: Button
purpose: Trigger a primary or secondary application action.
preferredNativeElement: button

requiredStates:
  - default
  - hover
  - focus-visible
  - active
  - disabled

inspectorGroups:
  - id: appearance
    label: Appearance
    fields:
      - path: contract.properties.appearance
        label: Appearance
        control: segmented
        options: [filled, outlined, subtle]
        required: true

tokenSlots:
  - id: root.background
    label: Background
    types: [color]
    required: true
  - id: root.foreground
    label: Foreground
    types: [color]
    required: true

constraints:
  - when: iconPlacement == icon-only
    require: accessibleLabel
