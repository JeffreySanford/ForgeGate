id: blueprint.radio-group
version: 1.0.0
name: Radio group
purpose: Let the user select exactly one option from a small set of mutually exclusive choices.
preferredNativeElement: fieldset

requiredStates:
  - default
  - selected
  - disabled
  - required
  - error

inspectorGroups:
  - id: grouping
    label: Grouping
    fields:
      - path: contract.properties.groupLabel
        label: Group label
        control: text
        required: true
      - path: contract.properties.description
        label: Description
        control: text

tokenSlots:
  - id: root.background
    label: Background
    types: [color]
    required: true
  - id: root.foreground
    label: Foreground
    types: [color]
    required: true

constraints:
  - when: error == true
    require: accessibleDescription
